# 系统配置示例文件
# 复制此文件为config.yaml并根据实际环境修改配置
# 或者使用环境变量覆盖这些配置项 (例如: APP_SERVICES_GPU_URL)

services:
  gpu:
    # GPU 服务主机和端口，请替换为实际值
    host: "0.0.0.0"
    port: 7001
  cpu:
    # CPU 服务主机和端口，请替换为实际值
    host: "0.0.0.0"
    port: 7002
  conductor:
    # sysHAX服务配置
    host: "0.0.0.0"
    port: 7010

models:
  # 指定使用的模型
  model_name: "{MODEL_NAME}"

system:
  # 请求超时时间(秒)
  request_timeout: 600

decider:
  # GPU kvcache使用率阈值
  gpu_kv_cache_threshold: 90
  # GPU 吞吐量下限
  gpu_throughput_lower_bound: 10
  # GPU 最大并发量
  gpu_max_batch_size: 256
  # CPU 最大并发量
  cpu_max_batch_size: 256

monitor:
  # 监控间隔(秒)
  interval: 1