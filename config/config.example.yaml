# 系统配置示例文件
# 复制此文件为config.yaml并根据实际环境修改配置
# 或者使用环境变量覆盖这些配置项 (例如: APP_SERVICES_GPU_URL)

services:
  gpu:
    # GPU 服务主机和端口，请替换为实际值
    host: "0.0.0.0"
    port: 7001
  cpu:
    # CPU 服务主机和端口，请替换为实际值
    host: "0.0.0.0"
    port: 7002
  conductor:
    # sysHAX服务配置
    host: "0.0.0.0"
    port: 7010

system:
  # 请求超时时间(秒)
  request_timeout: 600

decider:
  # 是否开启自动PD offload
  auto_pd_offload: false

  # CPU 最大并发量
  cpu_max_batch_size: 20
