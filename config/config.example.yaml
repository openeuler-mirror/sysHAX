# 系统配置示例文件
# 复制此文件为config.yaml并根据实际环境修改配置
# 或者使用环境变量覆盖这些配置项 (例如: APP_SERVICES_GPU_URL)

services:
  # GPU / CPU 服务支持两种写法：
  #   1) 单实例(向后兼容)：直接写 host/port 映射，例如
  #        gpu:
  #          host: "0.0.0.0"
  #          port: 7001
  #   2) 多实例池：写成列表，sysHAX 会在池内做负载均衡
  gpu:
    # GPU 服务实例池，请替换为实际值；单实例场景保留一项即可
    - host: "0.0.0.0"
      port: 7001
    # - host: "0.0.0.0"
    #   port: 7003
  cpu:
    # CPU 服务实例池，请替换为实际值
    - host: "0.0.0.0"
      port: 7002
  conductor:
    # sysHAX服务配置
    host: "0.0.0.0"
    port: 7010

system:
  # 请求超时时间(秒)
  request_timeout: 600

decider:
  # 是否开启自动PD offload
  auto_pd_offload: false

  # CPU 最大并发量
  cpu_max_batch_size: 20

heartbeat:
  # 探活间隔（秒）：每隔多长时间对每个节点发送一次 /health 探测
  interval: 10
  # 单次探活超时（秒）：超过此时间视为本次探活失败
  timeout: 3.0
  # 连续失败阈值：连续失败达到此次数后将节点从调度池摘除；节点恢复后自动重新加入
  fail_threshold: 3
