line-length = 120
indent-width = 4
target-version = "py39"

[lint]
# 存量兼容：仅启用错误类规则；清理 PR 后按路线图加回 B/UP/SIM/RUF
select = ["E", "F", "I"]
ignore = [
    "ANN401",
    "ARG002",
    "D400",
    "D415",
    "PYI019",
    "RUF001",
    "RUF002",
    "RUF003",
    "S104",
    "TD002",
    "TD003",
    "INP001",
    "D203",
    "D212",
    "S101",
    "UP007",
    "E501"
]

[format]
quote-style = "double"
